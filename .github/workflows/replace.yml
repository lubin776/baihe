name: Do下载

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  download-and-extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ZIP
        run: |
          set -e
          curl -fL -A "Mozilla/5.0" -e "https://mpimg.cn/" \
            -o /tmp/archive.zip \
            "https://mpimg.cn/down.php/0dd7e1a4bd90a2eb521f6e301983de88.zip"
          ls -lh /tmp/archive.zip
          file /tmp/archive.zip

      - name: Verify ZIP
        run: |
          set -e
          if ! unzip -t /tmp/archive.zip >/dev/null 2>&1; then
            echo "::error::下载的文件不是有效 ZIP"
            head -c 500 /tmp/archive.zip || true
            exit 1
          fi

      - name: Extract ZIP to repo root
        run: |
          set -e
          unzip -o /tmp/archive.zip -d .
          ls -la

      - name: Restore existing workflow files
        run: |
          set -e
          # 不让 ZIP 覆盖仓库里的 .github/workflows，避免 push 被拒
          if [ -d .github/workflows ]; then
            git checkout -- .github/workflows || true
          fi

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交。"
            exit 0
          fi
          git commit -m "Add files from ZIP"
          git push