name: Download and Extract ZIP

# 触发方式：手动触发
on:
  workflow_dispatch:

# 写权限，用于后续提交文件到仓库
permissions:
  contents: write

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download ZIP file
        run: |
          echo "开始下载 ZIP 文件..."
          curl -L -o downloaded_file.zip "https://mpimg.cn/down.php/444969b7417312313611ed35bd7cf6c8.zip"
          echo "下载完成。"
          
      - name: Unzip to repository root
        run: |
          echo "开始解压到仓库根目录..."
          unzip -o downloaded_file.zip -d .
          echo "解压完成。"
          
      - name: Clean up ZIP file
        run: |
          rm -f downloaded_file.zip
          
