- name: Extract ZIP to repo root
  run: |
    set -e
    unzip -o /tmp/archive.zip -d .
    ls -la

- name: Reset workflow files (avoid push rejection)
  run: |
    set -e
    # 1. 让 ZIP 里的 workflow 文件回到仓库原始状态（未跟踪的直接删掉）
    git checkout -- .github/workflows 2>/dev/null || true
    git clean -fd .github/workflows 2>/dev/null || true
    # 2. 确认没有 workflow 改动
    git status --porcelain .github/workflows || true

- name: Commit and push
  run: |
    set -e
    git config user.name "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"
    git add -A
    # 再把 workflow 目录从暂存区移除，双保险
    git reset HEAD .github/workflows 2>/dev/null || true
    if git diff --cached --quiet; then
      echo "没有变化，跳过提交。"
      exit 0
    fi
    git commit -m "Add files from ZIP"
    git push