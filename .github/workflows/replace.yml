name: Re ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ZIP
        run: |
          curl -L -A "Mozilla/5.0" -e "https://mpimg.cn/" \
            -o /tmp/archive.zip \
            "https://mpimg.cn/down.php/0dd7e1a4bd90a2eb521f6e301983de88.zip"
          ls -lh /tmp/archive.zip
          file /tmp/archive.zip

      - name: Verify ZIP
        run: |
          if ! unzip -t /tmp/archive.zip >/dev/null 2>&1; then
            echo "下载的文件不是有效的 ZIP。"
            head -c 500 /tmp/archive.zip
            exit 1
          fi

      - name: Delete old repo content (keep workflow)
        run: |
          shopt -s dotglob
          for item in *; do
            if [ "$item" = ".github" ]; then
              find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
            elif [ "$item" = ".git" ]; then
              continue
            else
              rm -rf "$item"
            fi
          done
          ls -la

      - name: Extract ZIP to repo root
        run: |
          unzip -o /tmp/archive.zip -d .
          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交。"
          else
            git commit -m "Replace repo content from ZIP"
            git push
          fi