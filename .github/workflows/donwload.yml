name: 下载解压插入

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  download-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZIP
        run: |
          curl -L -o archive.zip "https://mpimg.cn/down.php/b401712a3a953fcb4f0f741d6c68e940.zip"

      - name: Extract ZIP to repo root
        run: |
          unzip -o archive.zip -d .

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Add files from downloaded ZIP"
          git push